const player={x:0,z:0,facing:'front',phase:0,walking:false};
const keys=new Map(), bindings={ArrowUp:'back',KeyW:'back',ArrowDown:'front',KeyS:'front',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
const rows=['front','back','right','left'];
function reset(){Object.assign(player,{x:0,z:0,facing:'front',phase:0,walking:false});keys.clear()}
canvas.focus();
canvas.addEventListener('keydown',event=>{
  if(event.code==='KeyR'){reset();return}
  if(!bindings[event.code])return;
  event.preventDefault();
  if(!event.repeat)keys.set(event.code,bindings[event.code]);
});
window.addEventListener('keyup',event=>keys.delete(event.code));
canvas.addEventListener('blur',()=>keys.clear());
window.addEventListener('blur',()=>keys.clear());
document.addEventListener('visibilitychange',()=>keys.clear());
function move(dt){
  const dirs=[...keys.values()];
  const dx=Number(dirs.includes('right'))-Number(dirs.includes('left'));
  const dz=Number(dirs.includes('front'))-Number(dirs.includes('back'));
  const step=cfg.speed*dt/(Math.hypot(dx,dz)||1);
  const clamp=(v,max)=>Math.max(-max,Math.min(max,v));
  const x=clamp(player.x+dx*step,cfg.width/2-cfg.radius);
  const z=clamp(player.z+dz*step,cfg.depth/2-cfg.radius);
  player.walking=x!==player.x||z!==player.z;
  player.phase=player.walking?player.phase+dt*cfg.fps:0;
  const facing=dirs.reverse().find(d=>dx&&d===(dx>0?'right':'left')||dz&&d===(dz>0?'front':'back'));
  if(facing)player.facing=facing;
  Object.assign(player,{x,z});
}
let scale,originX,originY;
function project(x,y,z){return [originX+x*scale,originY+(z*Math.sin(cfg.angle)-y*Math.cos(cfg.angle))*scale]}
function face(points,color){
  ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...project(...p)):ctx.moveTo(...project(...p)));
  ctx.closePath();ctx.fillStyle=color;ctx.fill();
}
function render(){
 const w=canvas.clientWidth,h=canvas.clientHeight,dpr=window.devicePixelRatio||1;
 if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
 scale=Math.min(w/12.4,h/9.4);originX=w/2;originY=h/2+.71*scale;
 const a=cfg.width/2,b=cfg.depth/2,t=.12,H=cfg.wall;
 face([[-a-t,0,b],[a+t,0,b],[a+t,-t,b],[-a-t,-t,b]],'#aba697');
 face([[-a,0,-b],[a,0,-b],[a,0,b],[-a,0,b]],'#e8e4d8');
 ctx.strokeStyle='#dbd7cb';ctx.lineWidth=.7;
 function seam(p,q){ctx.beginPath();ctx.moveTo(...project(...p));ctx.lineTo(...project(...q));ctx.stroke()}
 for(let z=-b+2;z<b;z+=2)seam([-a,0,z],[a,0,z]);
 for(let x=-a+2;x<a;x+=2)seam([x,0,-b],[x,0,b]);
 face([[-a,0,-b],[a,0,-b],[a,H,-b],[-a,H,-b]],'#d2cfc2');
 face([[-a-t,H,-b-t],[a+t,H,-b-t],[a+t,H,-b],[-a-t,H,-b]],'#e6e3d8');
 for(const sign of [-1,1]){
  const inner=a*sign,outer=(a+t)*sign;
  face([[inner,H,-b],[outer,H,-b],[outer,H,b],[inner,H,b]],'#dedbcf');
  face([[inner,H,b],[outer,H,b],[outer,-t,b],[inner,-t,b]],'#bcb8aa');
 }
 const [px,py]=project(player.x,0,player.z);
 ctx.fillStyle='rgba(74,69,54,.16)';ctx.beginPath();ctx.ellipse(px,py,.27*scale,.085*scale,0,0,2*Math.PI);ctx.fill();
 if(sprite.complete&&sprite.naturalWidth){
   const unit=cfg.height*scale*Math.cos(cfg.angle)/43;
   const frame=player.walking?1+Math.floor(player.phase)%4:0;
   ctx.imageSmoothingEnabled=false;
   ctx.drawImage(sprite,32*frame,48*rows.indexOf(player.facing),32,48,px-16*unit,py-45*unit,32*unit,48*unit);
 }
}
let previous=performance.now();
function tick(now){move(Math.min((now-previous)/1000,.05));previous=now;render();requestAnimationFrame(tick)}
requestAnimationFrame(tick);
