const player={x:0,z:3.55,facing:'back',phase:0,walking:false};
const keys=new Map(), bindings={ArrowUp:'back',KeyW:'back',ArrowDown:'front',KeyS:'front',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
const rows=['front','back','right','left'];
function reset(){Object.assign(player,{x:0,z:3.55,facing:'back',phase:0,walking:false});keys.clear()}
canvas.focus();
canvas.addEventListener('keydown',event=>{
  if(event.code==='KeyR'){reset();return}
  if(!bindings[event.code])return;
  event.preventDefault();
  if(!event.repeat)keys.set(event.code,bindings[event.code]);
});
window.addEventListener('keyup',event=>keys.delete(event.code));
canvas.addEventListener('blur',()=>keys.clear());
window.addEventListener('blur',()=>keys.clear());
document.addEventListener('visibilitychange',()=>keys.clear());
function move(dt){
  const dirs=[...keys.values()];
  const dx=Number(dirs.includes('right'))-Number(dirs.includes('left'));
  const dz=Number(dirs.includes('front'))-Number(dirs.includes('back'));
  const step=cfg.speed*dt/(Math.hypot(dx,dz)||1);
  const clamp=(v,max)=>Math.max(-max,Math.min(max,v));
  const limit=cfg.width/2-cfg.radius;
  const proposedX=clamp(player.x+dx*step,limit);
  const x=onFloor(proposedX,player.z)?proposedX:player.x;
  const proposedZ=clamp(player.z+dz*step,cfg.depth/2-cfg.radius);
  const z=onFloor(x,proposedZ)?proposedZ:player.z;
  player.walking=x!==player.x||z!==player.z;
  player.phase=player.walking?player.phase+dt*cfg.fps:0;
  const facing=dirs.reverse().find(d=>dx&&d===(dx>0?'right':'left')||dz&&d===(dz>0?'front':'back'));
  if(facing)player.facing=facing;
  Object.assign(player,{x,z});
}
// Project ground coordinates onto the illustrated floor, widening toward the entrance.
function ground(x,z){
 const depth=(z+4)/8;
 return [320+x*(40.5+14.8*depth),116+depth*243];
}
const bays=[[114,182],[76,305],[526,182],[564,305]];
function onFloor(x,z){
 const [px,py]=ground(x,z);
 return !bays.some(([cx,base])=>Math.abs(px-cx)<40 && py>base-76 && py<base+6);
}
function render(){
 const w=canvas.clientWidth,h=canvas.clientHeight,dpr=window.devicePixelRatio||1;
 if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){
   canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
 }
 const scale=Math.min(canvas.width/640,canvas.height/400);
 ctx.setTransform(scale,0,0,scale,Math.round((canvas.width-640*scale)/2),Math.round((canvas.height-400*scale)/2));
 ctx.imageSmoothingEnabled=false;
 if(hall.complete && hall.naturalWidth)ctx.drawImage(hall,0,0);
 if(!sprite.complete || !sprite.naturalWidth)return;
 const [px,py]=ground(player.x,player.z);
 const x=Math.round(px),y=Math.round(py);
 const unit=.85+.18*(player.z+4)/8;
 ctx.fillStyle='rgba(58,42,32,.32)';
 ctx.fillRect(x-7,y-2,15,3);
 ctx.fillRect(x-5,y-3,11,5);
 const frame=player.walking?1+Math.floor(player.phase)%4:0;
 ctx.drawImage(sprite,32*frame,48*rows.indexOf(player.facing),32,48,
   x-Math.round(16*unit),y-Math.round(45*unit),Math.round(32*unit),Math.round(48*unit));
}
let previous=performance.now();
function tick(now){move(Math.min((now-previous)/1000,.05));previous=now;render();requestAnimationFrame(tick)}
requestAnimationFrame(tick);
</script></html>
